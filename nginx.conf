# Static serving for the Radical Movies SPA (dist/).
# The API + Socket.IO are NOT served here — the edge (Caddy/Traefik) routes
# /api and /socket.io to the api service and everything else to this container,
# preserving same-origin.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Assets are content-hashed → safe to cache forever. HTML is no-store so a
  # deploy is picked up immediately (hashed asset names do the busting).
  location ~* \.(js|css|png|jpg|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /sw.js        { add_header Cache-Control "no-store"; try_files $uri =404; }
  location = /manifest.json { try_files $uri =404; }

  # Page routes: /login -> login.html, etc.; fall back to the SPA shell.
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri.html /index.html;
  }
}
