name: deploy-pages
# Build the static SPA and publish to GitHub Pages. API_BASE bakes the absolute
# API origin into the bundle (cross-origin, since Pages can't proxy /api). Set
# repo Variables API_BASE / PAGES_CNAME to override the defaults below.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static bundle
        env:
          API_BASE: ${{ vars.API_BASE || 'https://api.radicalmovies.org' }}
          PAGES_CNAME: ${{ vars.PAGES_CNAME || 'radicalmovies.org' }}
        run: node build.mjs && test -f dist/index.html && test -f dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
