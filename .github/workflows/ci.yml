name: build
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build static bundle
        run: node build.mjs && test -f dist/index.html
      - name: Build web image (Dockerfile validation)
        run: docker build -t radical-movies-web:ci .
